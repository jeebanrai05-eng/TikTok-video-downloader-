name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'
      release_title:
        description: 'Release Title'
        required: false
        default: 'TikSave 8K 120FPS Ultra v1.0.2'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keys
        shell: bash
        run: |
          # 1. Prepare standard debug.keystore
          if [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore..."
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Creating standard debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Prepare genuine production upload keystore (Always uses verified original key)
          B64_KEY="${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}"
          if [ -n "$B64_KEY" ]; then
            echo "Decoding verified production keystore from GitHub Secret..."
            echo "$B64_KEY" | base64 -d > my-upload-key.jks
          elif [ -f "my-upload-key.jks" ]; then
            echo "Using verified my-upload-key.jks from repository..."
          elif [ -f "app-release-upload.jks" ]; then
            echo "Using verified app-release-upload.jks from repository..."
            cp -f app-release-upload.jks my-upload-key.jks
          elif [ -f "app-release-upload.jks.base64" ]; then
            echo "Decoding verified app-release-upload.jks.base64..."
            base64 -d app-release-upload.jks.base64 > my-upload-key.jks
          else
            echo "Decoding embedded verified production keystore..."
            echo "" | base64 -d > my-upload-key.jks
          fi

          # Copy keystore to app module to ensure Gradle resolves it in all environments
          cp -f my-upload-key.jks app/my-upload-key.jks

      - name: Build Production Release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || 'tiksave2026pass' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'tiksave2026pass' }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        shell: bash
        run: |
          mkdir -p build-apks
          # Find and copy release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" build-apks/TikSave-Release.apk
            echo "Release APK ready: TikSave-Release.apk"
          fi

          ls -lh build-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TikSave-APK-Builds
          path: build-apks/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          # Extract version from version.json or fallback
          VER_NAME="1.0.2"
          if [ -f "version.json" ]; then
            PARSED_VER=$(grep -o '"versionName"[[:space:]]*:[[:space:]]*"[^"]*"' version.json | head -n 1 | cut -d'"' -f4)
            if [ -n "$PARSED_VER" ]; then
              VER_NAME="$PARSED_VER"
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="v${VER_NAME}"
            fi
            TITLE="${{ github.event.inputs.release_title }}"
            if [ -z "$TITLE" ]; then
              TITLE="TikSave 8K 120FPS Ultra ${TAG}"
            fi
            PUBLISH="${{ github.event.inputs.create_release }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="TikSave 8K 120FPS Ultra ${TAG}"
            PUBLISH="true"
          else
            # Pushed to main or master: automatically publish release
            TAG="v${VER_NAME}"
            TITLE="TikSave 8K 120FPS Ultra ${TAG}"
            PUBLISH="true"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "publish=$PUBLISH" >> $GITHUB_OUTPUT
          echo "Release config: tag=$TAG, title=$TITLE, publish=$PUBLISH"

      - name: Create or Update GitHub Release
        if: steps.release_info.outputs.publish == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VAL: ${{ steps.release_info.outputs.tag_name }}
          TITLE_VAL: ${{ steps.release_info.outputs.title }}
        run: |
          TAG="${TAG_VAL:-v1.0.2}"
          TITLE="${TITLE_VAL:-TikSave 8K 120FPS Ultra $TAG}"
          echo "Processing Release for tag: $TAG ($TITLE)"

          # Configure git author
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push git tag to origin if it does not exist
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Creating git tag $TAG..."
            git tag -a "$TAG" -m "$TITLE" || git tag "$TAG"
            git push origin "$TAG" || true
          fi

          # Prepare release notes
          cat << 'EOF' > release_body.md
          ## TikSave — TikTok Video Without Watermark Downloader

          ### ✨ What's New
          - **8K Ultra & 120FPS Extreme Support**: Ultra-crisp resolution, smooth frame rate without compression artifacts.
          - **Single File Storage**: Fixed double download bug — saves exactly 1 clean copy directly to Gallery and Device Storage.
          - **Animated In-App Update Engine**: Modern loading radar, download progress bar, and installation launcher inside the app.
          - **Real-Time Push Notification**: Instant alerts for new app releases and feature updates.
          - **Ultra Speed CDN Gateway**: High-throughput 64KB buffers with connection pooling.

          ### 📦 Download Links
          - **TikSave-Release.apk** (Official Production Release)
          EOF

          # Publish via GitHub CLI (handles creating, updating, and uploading assets)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub. Updating release assets..."
            gh release upload "$TAG" build-apks/TikSave-Release.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release_body.md
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" build-apks/TikSave-Release.apk \
              --title "$TITLE" \
              --notes-file release_body.md \
              --target "${{ github.sha }}"
          fi

          echo "✅ GitHub Release successfully published!"
          gh release view "$TAG"

