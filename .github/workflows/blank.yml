name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'
      release_title:
        description: 'Release Title'
        required: false
        default: 'TikSave 8K 120FPS Ultra v1.0.2'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keys
        shell: bash
        run: |
          # Prepare debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Prepare release keystore using repository secrets
          B64_KEY="${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}"
          if [ -n "$B64_KEY" ]; then
            echo "Decoding custom release keystore from GitHub Secret..."
            echo "$B64_KEY" | base64 -d > my-upload-key.jks
          else
            echo "Generating fallback upload keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass "${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || 'tiksave2026pass' }}" -alias "${{ secrets.RELEASE_KEY_ALIAS || 'upload' }}" -keypass "${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'tiksave2026pass' }}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TikSave,O=TikSave,C=US"
          fi

      - name: Build Debug and Release APKs
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || 'tiksave2026pass' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'tiksave2026pass' }}
        run: |
          gradle :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        shell: bash
        run: |
          mkdir -p build-apks
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" build-apks/TikSave-Release.apk
            echo "Release APK ready: TikSave-Release.apk"
          fi

          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" build-apks/TikSave-Debug.apk
            echo "Debug APK ready: TikSave-Debug.apk"
          fi

          ls -lh build-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TikSave-APK-Builds
          path: build-apks/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          # Extract version from version.json or fallback
          VER_NAME="1.0.2"
          if [ -f "version.json" ]; then
            PARSED_VER=$(grep -o '"versionName"[[:space:]]*:[[:space:]]*"[^"]*"' version.json | head -n 1 | cut -d'"' -f4)
            if [ -n "$PARSED_VER" ]; then
              VER_NAME="$PARSED_VER"
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="v${VER_NAME}"
            fi
            TITLE="${{ github.event.inputs.release_title }}"
            if [ -z "$TITLE" ]; then
              TITLE="TikSave 8K 120FPS Ultra ${TAG}"
            fi
            PUBLISH="${{ github.event.inputs.create_release }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="TikSave 8K 120FPS Ultra ${TAG}"
            PUBLISH="true"
          else
            # Pushed to main or master: automatically publish release
            TAG="v${VER_NAME}"
            TITLE="TikSave 8K 120FPS Ultra ${TAG}"
            PUBLISH="true"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "publish=$PUBLISH" >> $GITHUB_OUTPUT
          echo "Release config: tag=$TAG, title=$TITLE, publish=$PUBLISH"

      - name: Create GitHub Release
        if: steps.release_info.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name || steps.release_info.outputs.tag || 'v1.0.2' }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.title || 'TikSave 8K 120FPS Ultra v1.0.2' }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## TikSave — TikTok Video Without Watermark Downloader (${{ steps.release_info.outputs.tag_name || steps.release_info.outputs.tag || 'v1.0.2' }})

            ### Highlights
            - **8K Ultra & 120FPS Extreme Support**: Super smooth video processing engine with extreme resolution & fidelity.
            - **Single File Storage**: Fixed double download bug — now saves exactly 1 clean copy directly to Gallery and Device Storage.
            - **Animated Self Update UI**: Modern loading radar, download progress bar, and installation launcher inside the app.
            - **Real-Time Push Notification**: Instant alerts for new app releases and feature updates.
            - **Ultra Speed CDN Engine**: High-throughput 64KB buffers with connection pooling.

            ### Downloads
            - **[TikSave-Release.apk](TikSave-Release.apk)** (Production Release)
            - **[TikSave-Debug.apk](TikSave-Debug.apk)** (Testing Build)
          files: |
            build-apks/TikSave-Release.apk
            build-apks/TikSave-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
