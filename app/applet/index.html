<script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlInput = document.getElementById('tiktok-url-input');
      const pasteBtn = document.getElementById('paste-link-btn');
      const fetchBtn = document.getElementById('fetch-video-btn');
      const demoCards = document.querySelectorAll('.demo-card');

      demoCards.forEach((card) => {
        card.addEventListener('click', () => {
          const demoUrl = card.getAttribute('data-demo-url');
          if (demoUrl) {
            urlInput.value = demoUrl;
            urlInput.focus();
          }
        });
      });

      pasteBtn.addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          if (text) urlInput.value = text;
        } catch {
          urlInput.value = 'https://www.tiktok.com/@cyberwave/video/7391029481';
        }
      });

      fetchBtn.addEventListener('click', () => {
        const orig = fetchBtn.innerHTML;
        fetchBtn.innerHTML = '<span class="animate-pulse">Fetching 8K Stream...</span>';
        setTimeout(() => { fetchBtn.innerHTML = orig; }, 1200);
      });
    });
  </script>
